spring.application.name=homestay-backend

# Port of the embedded Tomcat server (Task 3, Section 7). Override with SERVER_PORT.
server.port=${SERVER_PORT:8080}

# Expose only the health endpoint: GET /actuator/health -> {"status":"UP"}
management.endpoints.web.exposure.include=health

# Database, JWT and admin settings are added in Sprint 1 and read from
# environment variables (see .env.example). No secrets are stored in this file.
